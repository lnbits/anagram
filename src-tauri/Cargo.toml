[package]
name = "anagram"
version = "0.9.0"
description = "Private Nostr messaging"
edition = "2021"
[lib]
name = "anagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
[dependencies]
anagram-iroh-calls = { path = "../iroh-calls" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "ios")'.dependencies]
# netwatch 0.19.3 still uses routing constants removed from iOS in libc 0.2.190.
# Remove this constraint when netwatch supports the newer iOS definitions.
# https://github.com/rust-lang/libc/releases/tag/0.2.190
libc = "=0.2.189"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
nostr = { version = "0.44.8", features = ["nip59"] }

[dev-dependencies]
nostr = { version = "0.44.8", features = ["nip59"] }

# netdev 0.46.3 uses a libc type no longer exposed on iOS. Remove this pin
# when the Apple compatibility fix ships: https://github.com/shellrow/netdev/pull/192
[patch.crates-io]
netdev = { git = "https://github.com/shellrow/netdev", rev = "1327c36c32027d7252093cc1b58d9abd5a351496" }
# iOS must avoid macOS-only SystemConfiguration APIs; see vendor/README.txt.
netwatch = { path = "vendor/netwatch-0.19.3" }
n0-dns-resolver = { path = "vendor/n0-dns-resolver-0.1.0" }
