[package]
name = "anagram-iroh-calls"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
futures-util = "0.3"
n0-future = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"
