name: Checks
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  # Let a main run finish if it has already started deploying the site.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check committed app versions
        run: npm run release:check
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:iroh
      - run: npm run quality:all
      - run: npm run test:unit
      - name: Test standalone poll bot and encrypted interactions
        run: |
          cmp src/stores/nostr/botKeyboardProtocol.ts bot-example/poll/vendor/botKeyboardProtocol.ts
          poll_dir="$(mktemp -d)"
          trap 'rm -rf -- "$poll_dir"' EXIT
          cp bot-example/poll/{bot.js,package.json,package-lock.json,LICENSE,.env.example} "$poll_dir/"
          cp -R bot-example/poll/{vendor,test} "$poll_dir/"
          npm --prefix "$poll_dir" ci
          npm --prefix "$poll_dir" test
      - name: Test standalone GitHub issue agent bot
        run: |
          for f in bot.js runtime.js private-groups.js public-groups.js direct-messages.js; do
            cmp "bot-example/poll/vendor/$f" "bot-example/github-issue-agent/vendor/$f"
          done
          agent_dir="$(mktemp -d)"
          trap 'rm -rf -- "$agent_dir"' EXIT
          cp -R bot-example/github-issue-agent/. "$agent_dir/"
          npm --prefix "$agent_dir" ci
          npm --prefix "$agent_dir" run check
          npm --prefix "$agent_dir" test
      - name: Test mobile packaging and startup guards
        run: python3 -B -m unittest discover -s scripts/release-smoke -p 'test_*.py'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - run: npm run test:e2e:local -- e2e/bot-keyboards.spec.ts e2e/app.spec.ts e2e/composer-navigation.spec.ts e2e/native-session.spec.ts e2e/dm-relay-discovery.spec.ts e2e/group-history.spec.ts e2e/public-groups.spec.ts e2e/message-formatting.spec.ts e2e/parity/dm/link-preview.spec.ts
      - name: Test key safety, login links, history recovery and Android call startup
        run: npm run test:e2e:local -- e2e/key-exposure.spec.ts e2e/auth-link-banner.spec.ts e2e/history-hydration.spec.ts e2e/incoming-history-recovery.spec.ts e2e/android-call-startup.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failures
          path: |
            test-results/
            .artifacts/pwa-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare GitHub Pages routes
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: cp build/index.html build/404.html
      - name: Upload GitHub Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/
  deploy-pages:
    name: Deploy chat.nostr.com
    needs: web
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
