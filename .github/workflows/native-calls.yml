name: Native desktop call validation
on:
  pull_request:
    paths:
      - 'src/**/*call*'
      - 'src/**/*Call*'
      - 'src/**/*iroh*'
      - 'src/**/*Iroh*'
      - 'src/lib/platform/**'
      - 'iroh-calls/**'
      - 'static/iroh/**'
      - 'src-tauri/**'
      - 'scripts/native-calls/**'
      - 'scripts/verify-iroh.mjs'
      - '.github/workflows/native-calls.yml'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  # A separate, non-publishing validation branch.
  push:
    branches: ['call-validation/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-calls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calls:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-call-validation
      - run: npm ci
      - run: npm run verify:iroh
      - run: npm run build
      - name: Install local Iroh relay
        run: |
          cargo install iroh-relay --version 1.3.0 --locked --features server --bin iroh-relay
          iroh-relay --version
      - name: Exercise calls in the native WebView
        run: node scripts/native-calls/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-calls-${{ matrix.os }}
          path: .artifacts/native-calls/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
