name: Release
on:
  push:
    tags: ['v*', '[0-9]*']
    branches: ['build-validation/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (for example v0.9.0-rc1); never publishes'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      draft: ${{ steps.policy.outputs.draft }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Set build version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          export RELEASE_TAG="${REQUESTED_VERSION:-v$(node -p 'require("./package.json").version')}"
          npm run release:version
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Determine release visibility
        id: policy
        run: node scripts/release-policy.mjs
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - run: npm audit --audit-level=high
      - run: npm run verify:iroh
      - run: npm run quality:all
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/
          if-no-files-found: error
          retention-days: 7
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Set version from tag
        run: npm run release:version
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      - run: npm run verify:iroh
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/configure-macos-signing.mjs
      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: desktop-[platform]-[arch]-[bundle]
      - name: Install native test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Test packaged Linux app
        if: runner.os == 'Linux'
        env:
          ANAGRAM_DISPOSABLE_TEST: '1'
        run: |
          mapfile -t packages < <(find src-tauri/target -name '*.AppImage' -type f)
          [[ ${#packages[@]} -eq 1 ]]
          xvfb-run -a -s "-screen 0 1920x1440x24" dbus-run-session -- bash scripts/release-smoke/linux.sh "${packages[0]}"
      - name: Test installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem src-tauri/target -Recurse -Filter '*-setup.exe')
          if ($packages.Count -ne 1) { throw 'Expected one NSIS installer' }
          ./scripts/release-smoke/windows.ps1 -Installer $packages[0].FullName
      - name: Test installed macOS app
        if: runner.os == 'macOS'
        run: |
          packages=()
          while IFS= read -r -d '' package; do packages+=("$package"); done < <(find src-tauri/target -name '*.dmg' -type f -print0)
          [[ ${#packages[@]} -eq 1 ]]
          bash scripts/release-smoke/macos.sh "${packages[0]}"
      - name: Upload packaged-app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: desktop-smoke-results/
          if-no-files-found: ignore
          retention-days: 14
  android:
    needs: verify
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.verify.outputs.tag }}
    secrets: inherit
  publish:
    needs: [verify, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app
      - name: Package web app and checksums
        run: |
          shopt -s nullglob
          exes=(release-assets/*.exe)
          dmgs=(release-assets/*.dmg)
          appimages=(release-assets/*.AppImage)
          apks=(release-assets/*.apk)
          [[ ${#exes[@]} -eq 1 && ${#dmgs[@]} -eq 2 && ${#appimages[@]} -eq 1 && ${#apks[@]} -eq 1 ]]
          cd web-app
          zip -qr ../release-assets/anagram-web.zip .
          cd ../release-assets
          sha256sum ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: complete-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_DRAFT: ${{ needs.verify.outputs.draft }}
          RELEASE_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: bash scripts/publish-release.sh
