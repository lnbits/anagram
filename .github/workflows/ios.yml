name: iPhone app
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
  workflow_dispatch:
  # Isolated validation branches can test iOS without publishing a release.
  push:
    branches: ['ios-validation/**']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit:
    if: vars.IOS_BUILDS_ENABLED == 'true'
    # Match call-checks: the macOS 15 WebKit build stalls on the first VP8 append.
    # This browser runner is independent of the native Xcode build toolchain below.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Test iPhone layout and WebKit streaming media
        # Browser tests cover viewport/codec behavior, not native permissions,
        # Keychain, audio routing or delivery while the device is locked.
        run: npm run test:e2e:local -- --browser webkit e2e/ios-layout.spec.ts e2e/call-playback.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-webkit-diagnostics
          path: test-results/
          retention-days: 14
  ios:
    # Repository switch for standalone and reusable iPhone builds.
    if: vars.IOS_BUILDS_ENABLED == 'true'
    # Build independently so a WebKit failure still produces native diagnostics.
    # Both jobs remain required for this workflow to succeed.
    strategy:
      fail-fast: false
      matrix:
        target: [device, simulator]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-${{ matrix.target }}
      - run: npm ci
      - name: Test iPhone packaging and simulator guards
        run: |
          python3 -B -m unittest discover -s scripts/release-smoke -p 'test_ios*.py'
          xcrun clang -Wall -Wextra -Werror scripts/release-smoke/test_ios_dns.c -o /tmp/anagram-ios-dns-test
          /tmp/anagram-ios-dns-test
      - name: Set release version
        if: inputs.release_tag != '' || github.ref_type == 'tag'
        run: npm run release:version
        env:
          RELEASE_TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.release_tag }}
      - name: Check build versions
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.release_tag || '' }}
      - run: npm run verify:iroh
      - name: Install Xcode tooling
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun simctl list runtimes
      - name: Generate iPhone project
        run: |
          if [[ -z "${APPLE_DEVELOPMENT_TEAM:-}" ]]; then unset APPLE_DEVELOPMENT_TEAM; fi
          npm run tauri -- ios init --ci
          node scripts/mobile-version.mjs
          node scripts/prepare-ios.mjs
      - name: Build and package iPhone app
        if: matrix.target == 'device'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: bash scripts/package-ios.sh
      - name: Build iPhone simulator app
        if: matrix.target == 'simulator'
        run: node scripts/build-ios-simulator.mjs
      - name: Launch the packaged app in the iPhone simulator
        if: matrix.target == 'simulator'
        run: python3 scripts/release-smoke/ios.py
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'device' && success()
        with:
          name: mobile-ios
          path: mobile-assets/*.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'simulator' && always()
        with:
          name: ios-simulator-diagnostics
          path: .artifacts/ios-simulator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
