name: Release
on:
  push:
    tags: ['v*', '[0-9]*']
    branches: ['build-validation/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (for example v0.9.0-rc1); never publishes'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  call-checks:
    # Local reusable workflows and checkout use this release's commit.
    uses: ./.github/workflows/call-checks.yml
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      draft: ${{ steps.policy.outputs.draft }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Set build version
        id: version
        env:
          REQUESTED_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version || '' }}
        run: |
          export RELEASE_TAG="${REQUESTED_VERSION:-v$(node -p 'require("./package.json").version')}"
          npm run release:version
          npm run release:check
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Determine release visibility
        id: policy
        run: node scripts/release-policy.mjs
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - run: npm audit --audit-level=high
      - run: npm run verify:iroh
      - run: npm run quality:all
      - run: npm run test:unit
      - name: Test standalone poll bot and encrypted interactions
        run: |
          cmp src/stores/nostr/botKeyboardProtocol.ts bot-example/poll/vendor/botKeyboardProtocol.ts
          poll_dir="$(mktemp -d)"
          trap 'rm -rf -- "$poll_dir"' EXIT
          cp bot-example/poll/{bot.js,package.json,package-lock.json,LICENSE,.env.example} "$poll_dir/"
          cp -R bot-example/poll/{vendor,test} "$poll_dir/"
          npm --prefix "$poll_dir" ci
          npm --prefix "$poll_dir" test
      - name: Check iOS permission packaging guard
        run: python3 -B -m unittest discover -s scripts/release-smoke -p 'test_ios_permissions.py'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - name: Test messaging and browser interactions
        run: npm run test:e2e:local -- e2e/bot-keyboards.spec.ts e2e/app.spec.ts e2e/dm-relay-discovery.spec.ts e2e/group-history.spec.ts e2e/public-groups.spec.ts e2e/message-formatting.spec.ts e2e/parity/dm/link-preview.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-web-browser-failures
          path: |
            test-results/
            .artifacts/pwa-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/
          if-no-files-found: error
          retention-days: 7
  desktop:
    needs: [verify, call-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            bundle-config: --config src-tauri/tauri.ubuntu-appimage.conf.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev \
            libfontconfig1 libfreetype6 libexpat1 zlib1g libuuid1 libharfbuzz0b libfribidi0 \
            libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libgpg-error0 libcom-err2 \
            libgmp10 libasound2 libjack-jackd2-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-tools \
            build-essential ninja-build pkg-config bison flex python3-venv \
            libopus-dev libvpx-dev libogg-dev libvorbis-dev libpulse-dev libasound2-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswresample-dev libswscale-dev \
            libjpeg-dev libpng-dev libtheora-dev libgudev-1.0-dev liborc-0.4-dev \
            xdg-utils webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      - name: Cache portable media runtime
        if: runner.os == 'Linux'
        id: media-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/anagram-gstreamer
          key: gstreamer-ubuntu22-amd64-${{ hashFiles('scripts/appimage/build-gstreamer.sh', 'scripts/appimage/gstreamer.sha256') }}
      - name: Build portable media runtime
        if: runner.os == 'Linux' && steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/appimage/build-gstreamer.sh "$RUNNER_TEMP/anagram-gstreamer" "$RUNNER_TEMP/anagram-gstreamer-build"
      - name: Use portable media runtime for bundling
        if: runner.os == 'Linux'
        run: |
          {
            echo "ANAGRAM_GSTREAMER_PREFIX=$RUNNER_TEMP/anagram-gstreamer"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/anagram-gstreamer/lib"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/anagram-gstreamer/lib/pkgconfig"
            echo "GSTREAMER_PLUGINS_DIR=$RUNNER_TEMP/anagram-gstreamer/lib/gstreamer-1.0"
            echo "GSTREAMER_HELPERS_DIR=$RUNNER_TEMP/anagram-gstreamer/libexec/gstreamer-1.0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Set version from tag
        run: |
          npm run release:version
          npm run release:check
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      - run: npm run verify:iroh
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/configure-macos-signing.mjs
      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.bundle-config }} -- --locked
          uploadWorkflowArtifacts: ${{ runner.os != 'Linux' }}
          workflowArtifactNamePattern: desktop-[platform]-[arch]-[bundle]
      - name: Prepare portable Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mapfile -t packages < <(find src-tauri/target -name '*.AppImage' -type f)
          [[ ${#packages[@]} -eq 1 ]]
          bash scripts/postprocess-appimage.sh "${packages[0]}"
      - name: Install native test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Test packaged Linux app
        if: runner.os == 'Linux'
        env:
          ANAGRAM_DISPOSABLE_TEST: '1'
        run: |
          mapfile -t packages < <(find src-tauri/target -name '*.AppImage' -type f)
          [[ ${#packages[@]} -eq 1 ]]
          xvfb-run -a -s "-screen 0 1920x1440x24" dbus-run-session -- bash scripts/release-smoke/linux.sh "${packages[0]}"
          mkdir -p "$RUNNER_TEMP/anagram-linux-release"
          cp "${packages[0]}" "$RUNNER_TEMP/anagram-linux-release/"
      - name: Upload tested Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-amd64-appimage
          path: ${{ runner.temp }}/anagram-linux-release/*.AppImage
          if-no-files-found: error
      - name: Test installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem src-tauri/target -Recurse -Filter '*-setup.exe')
          if ($packages.Count -ne 1) { throw 'Expected one NSIS installer' }
          ./scripts/release-smoke/windows.ps1 -Installer $packages[0].FullName
      - name: Test installed macOS app
        if: runner.os == 'macOS'
        run: |
          packages=()
          while IFS= read -r -d '' package; do packages+=("$package"); done < <(find src-tauri/target -name '*.dmg' -type f -print0)
          [[ ${#packages[@]} -eq 1 ]]
          bash scripts/release-smoke/macos.sh "${packages[0]}"
      - name: Upload packaged-app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: desktop-smoke-results/
          if-no-files-found: ignore
          retention-days: 14
  android:
    needs: [verify, call-checks]
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.verify.outputs.tag }}
    secrets: inherit
  ios:
    needs: [verify, call-checks]
    if: vars.IOS_BUILDS_ENABLED == 'true'
    uses: ./.github/workflows/ios.yml
    with:
      release_tag: ${{ needs.verify.outputs.tag }}
    secrets: inherit
  publish:
    needs: [verify, call-checks, desktop, android, ios]
    # iPhone validation is optional while device/signing support is being set up.
    # Preserve every existing release gate, including cancellation handling.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.call-checks.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Report unavailable iPhone package
        if: vars.IOS_BUILDS_ENABLED == 'true' && needs.ios.result != 'success'
        run: |
          echo '::warning::iPhone build did not succeed; this release will omit the IPA. See the iOS jobs for diagnostics.'
          echo 'iPhone build did not succeed. Other platforms passed their required checks; this release omits the IPA.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android
          path: release-assets
      - uses: actions/download-artifact@v4
        if: needs.ios.result == 'success'
        with:
          name: mobile-ios
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app
      - name: Package web app and checksums
        env:
          IOS_BUILD_RESULT: ${{ needs.ios.result }}
        run: |
          shopt -s nullglob
          exes=(release-assets/*.exe)
          dmgs=(release-assets/*.dmg)
          appimages=(release-assets/*.AppImage)
          apks=(release-assets/*.apk)
          ipas=(release-assets/*.ipa)
          [[ ${#exes[@]} -eq 1 && ${#dmgs[@]} -eq 2 && ${#appimages[@]} -eq 1 && ${#apks[@]} -eq 1 ]]
          if [[ "$IOS_BUILD_RESULT" == success ]]; then
            [[ ${#ipas[@]} -eq 1 ]]
          else
            [[ ${#ipas[@]} -eq 0 ]]
          fi
          cd web-app
          zip -qr ../release-assets/anagram-web.zip .
          cd ../release-assets
          sha256sum ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: complete-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_DRAFT: ${{ needs.verify.outputs.draft }}
          RELEASE_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: bash scripts/publish-release.sh
