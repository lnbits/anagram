services:
  iroh-relay:
    image: n0computer/iroh-relay:v1.3.0
    command: ['--dev']
    ports:
      - '7003:3340'
  relay:
    image: scsibug/nostr-rs-relay:latest
    ports:
      - '7000:8080'
    volumes:
      - relay-data:/usr/src/app/db
  relay-two:
    image: scsibug/nostr-rs-relay:latest
    ports:
      - '7001:8080'
    volumes:
      - relay-two-data:/usr/src/app/db

volumes:
  relay-data:
  relay-two-data:
