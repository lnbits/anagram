name: Native desktop call validation
on:
  pull_request:
    paths:
      - 'src/**/*call*'
      - 'src/**/*Call*'
      - 'src/**/*iroh*'
      - 'src/**/*Iroh*'
      - 'src/lib/platform/**'
      - 'iroh-calls/**'
      - 'static/iroh/**'
      - 'src-tauri/**'
      - 'scripts/native-calls/**'
      - 'scripts/verify-iroh.mjs'
      - '.github/workflows/native-calls.yml'
      - '.github/actions/setup-call-relay/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  # A separate, non-publishing validation branch.
  push:
    branches: ['call-validation/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-calls-${{ github.ref }}
  # TEMPORARY PR #122 focus: preserve results from jobs already running.
  cancel-in-progress: ${{ github.event.pull_request.number != 122 }}
jobs:
  # PR #122 temporarily skips proven-green checks in the other workflows.
  # Keep every native case enabled: the current run still has unresolved cases.
  linux-calls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANAGRAM_CALL_TEST_PARTICIPANTS: ${{ matrix.participants }}
      ANAGRAM_CALL_TEST_SCENARIO: group
    strategy:
      fail-fast: false
      matrix:
        participants: [3, 4, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-call-validation-linux
          cache-on-failure: true
      - name: Identify runner image for package cache
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: media-cache
        with:
          path: ${{ runner.temp }}/anagram-gstreamer
          key: gstreamer-native-ubuntu24-${{ runner.arch }}-${{ hashFiles('scripts/appimage/build-gstreamer.sh', 'scripts/appimage/gstreamer.sha256', 'scripts/appimage/*.patch', 'scripts/native-calls/linux-dependencies.sh') }}
      - uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: ${{ runner.temp }}/native-call-apt/*.deb
          key: native-call-apt-ubuntu24-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/native-calls/linux-dependencies.sh') }}
      - name: Install native media and display dependencies
        timeout-minutes: 12
        env:
          MEDIA_CACHE_HIT: ${{ steps.media-cache.outputs.cache-hit }}
        run: bash scripts/native-calls/linux-dependencies.sh "$RUNNER_TEMP/native-call-apt" "$MEDIA_CACHE_HIT"
      - uses: actions/cache/save@v4
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/native-call-apt/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Build the call-capable media runtime
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/appimage/build-gstreamer.sh "$RUNNER_TEMP/anagram-gstreamer" "$RUNNER_TEMP/anagram-gstreamer-build"
      - uses: actions/cache/save@v4
        if: steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/anagram-gstreamer
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Select the media runtime
        run: |
          {
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/anagram-gstreamer/lib"
            echo "GST_PLUGIN_SYSTEM_PATH_1_0=$RUNNER_TEMP/anagram-gstreamer/lib/gstreamer-1.0"
            echo "GST_PLUGIN_SCANNER=$RUNNER_TEMP/anagram-gstreamer/libexec/gstreamer-1.0/gst-plugin-scanner"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run verify:iroh
      - run: npm run build
      - name: Prepare cached local Iroh relay
        uses: ./.github/actions/setup-call-relay
        with:
          image: ubuntu-24.04
      - name: Build native call probe
        timeout-minutes: 22
        env:
          ANAGRAM_CALL_TEST_BUILD_CONFIG: ${{ runner.temp }}/native-call-build.json
        run: node scripts/native-calls/build.mjs
      - name: Exercise isolated native Linux group calls and screen sharing
        env:
          ANAGRAM_CALL_TEST_BUILD_CONFIG: ${{ runner.temp }}/native-call-build.json
        run: xvfb-run -a -s '-screen 0 1600x1800x24' dbus-run-session -- bash scripts/native-calls/linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-calls-linux-${{ matrix.participants }}
          path: .artifacts/native-calls/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  calls:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-call-validation
          cache-on-failure: true
      - run: npm ci
      - run: npm run verify:iroh
      - run: npm run build
      - name: Prepare cached local Iroh relay
        uses: ./.github/actions/setup-call-relay
        with:
          image: ${{ matrix.os }}
      - name: Build native call probe
        timeout-minutes: 22
        env:
          ANAGRAM_CALL_TEST_BUILD_CONFIG: ${{ runner.temp }}/native-call-build.json
        run: node scripts/native-calls/build.mjs
      - name: Exercise calls in the native WebView
        env:
          ANAGRAM_CALL_TEST_BUILD_CONFIG: ${{ runner.temp }}/native-call-build.json
        run: node scripts/native-calls/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-calls-${{ matrix.os }}
          path: .artifacts/native-calls/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
