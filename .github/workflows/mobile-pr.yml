name: Mobile PR validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'static/**'
      - 'src-tauri/**'
      - 'iroh-calls/**'
      - 'scripts/**'
      - '.github/workflows/mobile-pr.yml'
      - '.github/actions/setup-android-pr/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/ios.yml'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    name: Android APK build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-pr
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-pr
      - run: npm run release:check
      - run: npm run verify:iroh
      - name: Generate Android project
        run: |
          npm run tauri -- android init --ci
          node scripts/prepare-android.mjs
          node scripts/mobile-version.mjs
          sdk=$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)
          [[ "$sdk" =~ ^[0-9]+$ ]]
          sdkmanager "platforms;android-$sdk"
          npm run tauri -- icon src-tauri/icons/icon.png --output src-tauri/icons
      - name: Build unsigned ARM64 APK
        run: npm run tauri -- android build --ci --apk --target aarch64 --config src-tauri/mobile-version.json -- --locked
      - name: Package Gradle project and native libraries
        run: python3 scripts/ci/package_android_gradle.py "$RUNNER_TEMP/android-gradle.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-android-gradle-project
          path: ${{ runner.temp }}/android-gradle.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr-android-build-reports
          path: src-tauri/gen/android/**/build/reports/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
  android-unit-tests:
    name: Android JVM tests
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-pr
      - uses: actions/download-artifact@v4
        with:
          name: pr-android-gradle-project
          path: ${{ runner.temp }}
      - name: Restore built Gradle project
        run: |
          mkdir -p src-tauri/gen
          tar -xzf "$RUNNER_TEMP/android-gradle.tar.gz" -C src-tauri/gen
          sdk=$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)
          [[ "$sdk" =~ ^[0-9]+$ ]]
          sdkmanager "platforms;android-$sdk"
      - name: Test notification crypto and policy
        run: ./src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:testArm64ReleaseUnitTest -x rustBuildArm64Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-android-unit-test-reports
          path: |
            src-tauri/gen/android/app/build/reports/
            src-tauri/gen/android/app/build/test-results/
            src-tauri/gen/android/build/reports/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
  android-device-harness:
    name: Android device-test compilation
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-pr
      - uses: actions/download-artifact@v4
        with:
          name: pr-android-gradle-project
          path: ${{ runner.temp }}
      - name: Restore built Gradle project
        run: |
          mkdir -p src-tauri/gen
          tar -xzf "$RUNNER_TEMP/android-gradle.tar.gz" -C src-tauri/gen
          sdk=$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)
          [[ "$sdk" =~ ^[0-9]+$ ]]
          sdkmanager "platforms;android-$sdk"
      - name: Compile device test harness
        # Device tests are executed by the release workflow's emulator job.
        run: ./src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:assembleUniversalDebug :app:assembleUniversalDebugAndroidTest -x rustBuildUniversalDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-android-device-harness-reports
          path: |
            src-tauri/gen/android/app/build/reports/
            src-tauri/gen/android/app/build/test-results/
            src-tauri/gen/android/build/reports/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
  ios-packaging-checks:
    name: iPhone packaging and DNS checks
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test iPhone packaging and simulator guards
        run: |
          python3 -B -m unittest discover -s scripts/release-smoke -p 'test_ios*.py'
          xcrun clang -Wall -Wextra -Werror scripts/release-smoke/test_ios_dns.c -o /tmp/anagram-ios-dns-test
          /tmp/anagram-ios-dns-test
  ios-build:
    name: iPhone simulator build
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      developer-dir: ${{ steps.xcode.outputs.developer-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-pr-simulator
      - run: npm ci
      - run: npm run release:check
      - run: npm run verify:iroh
      - name: Install Xcode tooling
        id: xcode
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          echo "developer-dir=$(xcode-select -p)" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list runtimes
      - name: Generate iPhone project
        run: |
          npm run tauri -- ios init --ci
          node scripts/mobile-version.mjs
          node scripts/prepare-ios.mjs
      - name: Build unsigned iPhone simulator app
        run: node scripts/build-ios-simulator.mjs
      - name: Archive simulator app with executable permissions
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          import tarfile
          sys.path.insert(0, 'scripts/release-smoke')
          from ios import simulator_app
          app = simulator_app(Path('src-tauri/gen/apple/build'))
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'ios-simulator-app.tar.gz', 'w:gz') as archive:
              archive.add(app, arcname=app.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr-ios-simulator-app
          path: ${{ runner.temp }}/ios-simulator-app.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  ios-startup:
    name: iPhone simulator startup
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Use the same installed Xcode as the producer of this simulator bundle.
      DEVELOPER_DIR: ${{ needs.ios-build.outputs.developer-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pr-ios-simulator-app
          path: ${{ runner.temp }}
      - name: Restore simulator app
        run: |
          mkdir -p src-tauri/gen/apple/build
          tar -xzf "$RUNNER_TEMP/ios-simulator-app.tar.gz" -C src-tauri/gen/apple/build
      - name: Launch the packaged app in the iPhone simulator
        run: python3 scripts/release-smoke/ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-ios-simulator-diagnostics
          path: .artifacts/ios-simulator/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
