name: Publish desktop and signed Android binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: validate
        shell: bash
        run: bash .github/scripts/validate-release-tag.sh

  build-android:
    name: Build signed Android release APK
    needs: validate-tag
    runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v6

        - uses: actions/setup-node@v6
          with:
            node-version: 24.x

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/anagram-release.jks"
          chmod 600 "$RUNNER_TEMP/anagram-release.jks"

      - name: Build signed Android release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anagram-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android:apk:release

      - name: Stage Android release asset
        shell: bash
        run: |
          bash .github/scripts/stage-release-asset.sh \
            dist/capacitor/android/apk/release \
            '*.apk' \
            release-assets/anagram-android-release.apk

      - uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: release-assets/anagram-android-release.apk
          if-no-files-found: error

        - uses: actions/upload-artifact@v6
          with:
            name: release-android
            path: release-assets/anagram-android-release.apk
            if-no-files-found: error
  build-linux:
    name: Build Linux Packages
    needs: validate-tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Quasar files
        run: npm run prepare:quasar

      - name: Install Linux package tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm xz-utils

      - name: Build Linux packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:electron:linux

      - name: Stage Linux release assets
        shell: bash
        run: |
          bash .github/scripts/stage-release-asset.sh dist/electron/Packaged '*.AppImage' release-assets/anagram-linux.AppImage
          bash .github/scripts/stage-release-asset.sh dist/electron/Packaged '*.deb' release-assets/anagram-linux.deb
          bash .github/scripts/stage-release-asset.sh dist/electron/Packaged '*.rpm' release-assets/anagram-linux.rpm

      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: release-assets/anagram-linux.*
          if-no-files-found: error

  build-macos:
    name: Build macOS ZIP
    needs: validate-tag
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Quasar files
        run: npm run prepare:quasar

      - name: Build macOS ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:electron:mac

      - name: Stage macOS release asset
        shell: bash
        run: bash .github/scripts/stage-release-asset.sh dist/electron/Packaged '*.zip' release-assets/anagram-macos.zip

      - uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: release-assets/anagram-macos.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    needs: validate-tag
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Quasar files
        run: npm run prepare:quasar

      - name: Build Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:electron:win

      - name: Stage Windows release asset
        shell: pwsh
        run: .github/scripts/stage-release-asset.ps1 -SearchRoot dist/electron/Packaged -Pattern '*.exe' -OutputPath release-assets/anagram-windows.exe

      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: release-assets/anagram-windows.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - build-android
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          COMMIT: ${{ needs.validate-tag.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh
