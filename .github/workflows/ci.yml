name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:iroh
      - run: npm run quality:all
      - run: npm run test:unit
      - name: Check iOS permission packaging guard
        run: python3 -B -m unittest discover -s scripts/release-smoke -p 'test_ios_permissions.py'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - run: npm run test:e2e:local -- e2e/app.spec.ts e2e/dm-relay-discovery.spec.ts e2e/group-history.spec.ts e2e/public-groups.spec.ts e2e/message-formatting.spec.ts e2e/parity/dm/link-preview.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
