name: Mobile PR validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'static/**'
      - 'src-tauri/**'
      - 'iroh-calls/**'
      - 'scripts/**'
      - '.github/workflows/mobile-pr.yml'
      - '.github/workflows/android.yml'
      - '.github/workflows/ios.yml'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android build and JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: '29.0.13846066'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-pr
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run release:check
      - run: npm run verify:iroh
      - name: Install NDK
        run: |
          sdkmanager "ndk;$NDK_VERSION" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Generate Android project
        run: |
          npm run tauri -- android init --ci
          node scripts/prepare-android.mjs
          node scripts/mobile-version.mjs
          sdk=$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)
          [[ "$sdk" =~ ^[0-9]+$ ]]
          sdkmanager "platforms;android-$sdk"
          npm run tauri -- icon src-tauri/icons/icon.png --output src-tauri/icons
      - name: Build unsigned ARM64 APK
        run: npm run tauri -- android build --ci --apk --target aarch64 --config src-tauri/mobile-version.json -- --locked
      - name: Test notification crypto and policy
        run: ./src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:testArm64ReleaseUnitTest -x rustBuildArm64Release
      - name: Compile device test harness
        # Device tests are executed by the release workflow's emulator job.
        run: ./src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:assembleUniversalDebug :app:assembleUniversalDebugAndroidTest -x rustBuildUniversalDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-android-test-reports
          path: |
            src-tauri/gen/android/app/build/reports/
            src-tauri/gen/android/app/build/test-results/
            src-tauri/gen/android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
  ios:
    name: iPhone simulator build and startup
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-pr-simulator
      - run: npm ci
      - run: npm run release:check
      - run: npm run verify:iroh
      - name: Test iPhone packaging and simulator guards
        run: |
          python3 -B -m unittest discover -s scripts/release-smoke -p 'test_ios*.py'
          xcrun clang -Wall -Wextra -Werror scripts/release-smoke/test_ios_dns.c -o /tmp/anagram-ios-dns-test
          /tmp/anagram-ios-dns-test
      - name: Install Xcode tooling
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list runtimes
      - name: Generate iPhone project
        run: |
          npm run tauri -- ios init --ci
          node scripts/mobile-version.mjs
          node scripts/prepare-ios.mjs
      - name: Build unsigned iPhone simulator app
        run: node scripts/build-ios-simulator.mjs
      - name: Launch the packaged app in the iPhone simulator
        run: python3 scripts/release-smoke/ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-ios-simulator-diagnostics
          path: .artifacts/ios-simulator/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
